    <!--
      Link previews. Slack, iMessage, LinkedIn and X all read these tags, not
      DNS, so a stale og:image is what makes a correctly-served page unfurl
      under the scaffolding tool's brand rather than this one. That is what
      these tags used to point at, and why the fix is here and not in the zone
      file.

      og:image must be an absolute URL on a public host: relative paths resolve
      against the scraper, not the page, and the preview silently falls back to
      nothing.
    -->
