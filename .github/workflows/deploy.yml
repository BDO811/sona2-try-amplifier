name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc -p tsconfig.app.json --noEmit

      - run: npx vitest run

      # Served from the domain root at try.amplifierhealth.com. public/CNAME
      # carries the custom domain into dist so each deploy keeps it.
      #
      # VITE_RECOMMENDATIONS=1: the latency fix (IPv4 keep-alive agent on the
      # recommendations function) is verified. Three calls at 6.4s, 7.1s,
      # 12.9s, no timeouts, down from the prior 40-48s. Ships the button.
      - run: npm run build
        env:
          VITE_RECOMMENDATIONS: "1"

      # The app uses BrowserRouter, so /detailed-analysis and friends are
      # client-side routes with no file behind them. GitHub Pages serves
      # 404.html for unknown paths; making it a copy of index.html lets the
      # router handle those URLs instead of showing Pages' own 404.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
